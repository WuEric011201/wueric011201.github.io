<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 360" role="img" aria-label="Switch model: ingress virtual output queues feeding an arbiter and crossbar feeding egress ports, with credit return arrows">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="currentColor"/>
    </marker>
    <marker id="arc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c2703d"/>
    </marker>
  </defs>
  <g fill="none" stroke="currentColor" stroke-width="1.6" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">

    <text x="120" y="26" font-size="15" font-weight="600" fill="currentColor" stroke="none" text-anchor="middle">Ingress port</text>
    <text x="410" y="26" font-size="15" font-weight="600" fill="currentColor" stroke="none" text-anchor="middle">Arbiter + crossbar</text>
    <text x="700" y="26" font-size="15" font-weight="600" fill="currentColor" stroke="none" text-anchor="middle">Egress ports</text>

    <!-- ingress VOQ stack -->
    <rect x="30" y="50" width="180" height="200" rx="8" stroke-dasharray="5 4" opacity="0.55"/>
    <g>
      <rect x="50" y="72" width="140" height="42" rx="5" fill="#4f8ab0" fill-opacity="0.18"/>
      <text x="120" y="98" font-size="13" fill="currentColor" stroke="none" text-anchor="middle">VOQ to out 0</text>
      <rect x="50" y="129" width="140" height="42" rx="5" fill="#4f8ab0" fill-opacity="0.18"/>
      <text x="120" y="155" font-size="13" fill="currentColor" stroke="none" text-anchor="middle">VOQ to out 1</text>
      <rect x="50" y="186" width="140" height="42" rx="5" fill="#4f8ab0" fill-opacity="0.18"/>
      <text x="120" y="212" font-size="13" fill="currentColor" stroke="none" text-anchor="middle">VOQ to out 2</text>
    </g>
    <line x1="0" y1="150" x2="28" y2="150" marker-end="url(#ar)"/>

    <!-- crossbar -->
    <rect x="320" y="60" width="180" height="180" rx="8"/>
    <g stroke-width="1.1" opacity="0.6">
      <line x1="350" y1="80" x2="350" y2="220"/>
      <line x1="410" y1="80" x2="410" y2="220"/>
      <line x1="470" y1="80" x2="470" y2="220"/>
      <line x1="336" y1="95" x2="486" y2="95"/>
      <line x1="336" y1="150" x2="486" y2="150"/>
      <line x1="336" y1="205" x2="486" y2="205"/>
    </g>
    <g fill="currentColor" stroke="none">
      <circle cx="350" cy="95" r="4.5"/>
      <circle cx="410" cy="150" r="4.5"/>
      <circle cx="470" cy="205" r="4.5"/>
    </g>

    <!-- ingress to crossbar -->
    <line x1="192" y1="93" x2="318" y2="93" marker-end="url(#ar)"/>
    <line x1="192" y1="150" x2="318" y2="150" marker-end="url(#ar)"/>
    <line x1="192" y1="207" x2="318" y2="207" marker-end="url(#ar)"/>

    <!-- egress -->
    <g>
      <rect x="620" y="72" width="160" height="42" rx="5" fill="#5c9367" fill-opacity="0.18"/>
      <text x="700" y="98" font-size="13" fill="currentColor" stroke="none" text-anchor="middle">Out 0 buffer</text>
      <rect x="620" y="129" width="160" height="42" rx="5" fill="#5c9367" fill-opacity="0.18"/>
      <text x="700" y="155" font-size="13" fill="currentColor" stroke="none" text-anchor="middle">Out 1 buffer</text>
      <rect x="620" y="186" width="160" height="42" rx="5" fill="#5c9367" fill-opacity="0.18"/>
      <text x="700" y="212" font-size="13" fill="currentColor" stroke="none" text-anchor="middle">Out 2 buffer</text>
    </g>
    <line x1="502" y1="93" x2="618" y2="93" marker-end="url(#ar)"/>
    <line x1="502" y1="150" x2="618" y2="150" marker-end="url(#ar)"/>
    <line x1="502" y1="207" x2="618" y2="207" marker-end="url(#ar)"/>
    <line x1="782" y1="93" x2="812" y2="93" marker-end="url(#ar)"/>
    <line x1="782" y1="150" x2="812" y2="150" marker-end="url(#ar)"/>
    <line x1="782" y1="207" x2="812" y2="207" marker-end="url(#ar)"/>

    <!-- credit return -->
    <path d="M700 236 L700 292 L120 292 L120 256" stroke="#c2703d" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#arc)"/>
    <text x="410" y="285" font-size="13" fill="#c2703d" stroke="none" text-anchor="middle" font-style="italic">credit return: a sender transmits only against advertised buffer space</text>

    <text x="410" y="330" font-size="12.5" fill="currentColor" stroke="none" text-anchor="middle" opacity="0.75">One queue per destination, so a packet blocked on a busy output cannot stall one bound for an idle output.</text>
  </g>
</svg>
